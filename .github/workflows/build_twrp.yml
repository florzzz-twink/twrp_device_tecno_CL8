name: Build TWRP CL8

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --force || true
          df -h

      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: device/tecno/CL8

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison gperf build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses-dev x11proto-core-dev libx11-dev lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 repo ccache

      - name: Sync TWRP 12.1 source
        run: |
          mkdir -p ~/twrp && cd ~/twrp
          git config --global user.name "builder"
          git config --global user.email "builder@example.com"
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b twrp-12.1
          repo sync -c -j4 --no-clone-bundle --no-tags --depth=1
          df -h

      - name: Build
        run: |
          cd ~/twrp
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          lunch twrp_CL8-eng
          make -j$(nproc) recoveryimage
          find out -name "*.img" | head -20

      - name: Upload recovery image
        uses: actions/upload-artifact@v4
        with:
          name: twrp_CL8_img
          path: |
            ~/twrp/out/target/product/CL8/*.img
